<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1B34" />
    <title>Tài khoản | Jielien International</title>
    <meta name="description" content="Quản lý hồ sơ, địa chỉ nhận hàng, đơn hàng và bảo mật tài khoản Jielien." />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="canonical" href="/tai-khoan" />
    <meta property="og:title" content="Tài khoản | Jielien International" />
    <meta property="og:description" content="Quản lý hồ sơ, địa chỉ nhận hàng, đơn hàng và bảo mật tài khoản Jielien." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/jielien-logo.jpg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Tài khoản | Jielien International" />
    <meta name="twitter:description" content="Quản lý hồ sơ, địa chỉ nhận hàng, đơn hàng và bảo mật tài khoản Jielien." />
    <link rel="icon" href="/assets/jielien-logo.jpg" />
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="/management.css" />
    <link rel="stylesheet" href="/account-v3.css" />
    <link rel="stylesheet" href="/language.css">
    <link rel="modulepreload" href="/ui-icons.js" />
    <link rel="modulepreload" href="/auth-session.js" />
    <link rel="modulepreload" href="/admin-access.js" />
    <link rel="modulepreload" href="/admin-nav.js" />
    <script type="module" src="/sentry-browser.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#account-main">Đến nội dung</a>
    <header class="management-header">
      <div class="management-wrap header-row">
        <a class="management-logo" href="/"
          ><img class="brand-logo" src="/assets/jielien-logo.jpg" alt="Jielien International" width="128" height="96"></a
        ><span class="header-caption">Tài khoản Jielien</span
        ><a class="header-back" href="/">Tiếp tục mua sắm</a>
      </div>
    </header>
    <main id="account-main" class="management-wrap account-main" tabindex="-1">
      <div class="loading" role="status">Đang kiểm tra phiên đăng nhập…</div>
    </main>
    <footer class="management-footer">
      <div class="management-wrap">
        Jielien International · Tài khoản và đơn hàng của bạn.
        <a href="/chinh-sach/bao-mat">Thông tin cá nhân</a>
      </div>
    </footer>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <dialog
      id="order-dialog"
      class="detail-dialog"
      aria-labelledby="order-dialog-title"
    >
      <div class="dialog-header">
        <h2 id="order-dialog-title">Chi tiết đơn hàng</h2>
        <button
          type="button"
          data-close-dialog
          aria-label="Đóng chi tiết đơn hàng"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="order-dialog-content"></div>
    </dialog>
    <script src="/account.js" type="module"></script>
    <script type="module" src="/language.js"></script>
  </body>
</html>
