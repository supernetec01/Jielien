<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1B34" />
    <title>Quản trị cửa hàng | Jielien</title>
    <link rel="icon" href="/assets/jielien-logo.jpg" />
    <link rel="preload" href="/fonts/be-vietnam-pro-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="/management.css" />
    <link rel="stylesheet" href="/admin-workspace.css" />
    <script type="module" src="/sentry-browser.js"></script>
  </head>
  <body class="admin-workspace">
    <a class="skip-link" href="#admin-content">Đến nội dung</a>
    <header class="management-header">
      <div class="management-wrap header-row">
        <a class="management-logo" href="/quan-tri" aria-label="Quản trị Jielien"><img class="brand-logo" src="/assets/jielien-logo.jpg" alt="Jielien" width="44" height="40"></a>
        <button type="button" id="admin-menu-toggle" aria-expanded="false" aria-controls="workspace-navigation" aria-label="Mở mục quản trị" hidden></button>
        <div class="topbar-location"><nav id="admin-breadcrumb" aria-label="Breadcrumb"><ol><li aria-current="page">Quản trị</li></ol></nav><span class="workspace-session" title="Phiên đăng nhập được bảo vệ" hidden><span>Phiên đăng nhập được bảo vệ</span></span></div>
        <div class="topbar-actions"><a class="header-back" aria-label="Xem website (mở tab mới)" href="/" target="_blank" rel="noopener noreferrer"><span class="website-label">Xem website</span></a>
        <div class="admin-account" hidden><button type="button" id="admin-account-toggle" aria-label="Mở menu tài khoản quản trị" aria-haspopup="menu" aria-expanded="false" aria-controls="admin-account-menu"><span class="user-avatar"></span><span class="admin-account-name">Admin</span></button><div id="admin-account-menu" role="menu" aria-label="Tài khoản quản trị" hidden><a role="menuitem" href="/tai-khoan">Tài khoản</a><button type="button" role="menuitem" id="admin-logout">Đăng xuất</button></div></div></div>
      </div>
    </header>
    <main id="admin-main" class="management-wrap admin-main">
      <div class="loading" role="status">Đang kiểm tra quyền truy cập…</div>
    </main>
    <footer class="management-footer">
      <div class="management-wrap">
        Jielien · Thao tác quản trị được kiểm tra quyền tại máy chủ và ghi nhật
        ký.
      </div>
    </footer>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <dialog
      id="admin-dialog"
      class="detail-dialog"
      aria-labelledby="admin-dialog-title"
    >
      <div class="dialog-header">
        <h2 id="admin-dialog-title">Chi tiết</h2>
        <button type="button" data-close-dialog aria-label="Đóng cửa sổ">
          ×
        </button>
      </div>
      <div id="admin-dialog-content"></div>
    </dialog>
    <script src="/admin.js" type="module"></script>
  </body>
</html>
